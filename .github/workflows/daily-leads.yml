name: Daily lead research

on:
  schedule:
    - cron: "0 13 * * *"   # every day at 13:00 UTC (about 8 AM Central)
  workflow_dispatch:        # lets you press a "Run" button to test

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python lead_research.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save the new leads
        run: |
          git config user.name "lead-bot"
          git config user.email "lead-bot@users.noreply.github.com"
          git add leads
          git diff --staged --quiet || git commit -m "New leads $(date +%F)"
          git push
